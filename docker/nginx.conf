server {
    listen 80;
    server_name localhost;
    root /app;

    # Security headers. Locations below inherit these automatically, UNLESS
    # they declare their own add_header (nginx resets inheritance per-directive
    # in that case) — such locations must `include` this file explicitly.
    include /app/docker/security-headers.conf;

    # Explicit allowlist of the frontend's static assets. /app is the full repo
    # (scrapers, docker/, docs, and the raw_html/ scrape cache the cron job
    # writes at runtime) — it must NOT be served wholesale via a generic
    # `root /app; try_files $uri ...` catch-all, or all of that becomes
    # publicly downloadable. Only add a new `location =` entry here when the
    # frontend genuinely needs a new static file.
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /index.css {
        try_files /index.css =404;
    }

    location = /app.js {
        try_files /app.js =404;
    }

    # Cache control for events/events.json since it is updated weekly.
    # This location sets its own add_header, so re-include security headers.
    location = /events/events.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        include /app/docker/security-headers.conf;
        try_files /events/events.json =404;
    }

    location / {
        return 404;
    }
}
